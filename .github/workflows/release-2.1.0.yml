name: Publicar SACW LOG 2.1.0
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency: sacw-release-v2.1.0
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compilar el portable de Windows
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '2.1.0') { throw 'Este flujo solo publica la versión 2.1.0.' }
          npm install --prefix "$env:RUNNER_TEMP/sacw-tools" --no-audit --no-fund postject@1.0.0-alpha.6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:SACW_POSTJECT = "$env:RUNNER_TEMP/sacw-tools/node_modules/postject/dist/cli.js"
          node build.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node desktop/build-portable.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item desktop/build/SACW-LOG-Portable.exe SACW-LOG-Portable-2.1.0.exe
      - name: Publicar el ejecutable en GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.1.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v2.1.0 SACW-LOG-Portable-2.1.0.exe
          } else {
            gh release create v2.1.0 SACW-LOG-Portable-2.1.0.exe --target "$env:GITHUB_SHA" --title "SACW LOG 2.1.0" --notes "Auto spot con nodo autorizado, tarjetas DX Cluster y RBN, libro compacto y cinco perfiles Yaesu mediante Hamlib."
          }
          exit $LASTEXITCODE
